name: 기능 제안
description: 부모님이 느낀 불편함이나 새로 있으면 좋을 기능을 알려 주세요.
title: "[제안] "
body:
  - type: markdown
    attributes:
      value: |
        이곳은 누구나 읽을 수 있는 공개 게시판입니다. 부모님 계정으로 작성해 주세요.
        아이 이름·얼굴·나이·연락처·비밀번호·백업 파일은 올리지 마세요.
        게임 기록은 자동으로 첨부되지 않습니다. 보안 문제는 아래 양식 대신 저장소 Security의 비공개 신고를 이용해 주세요.
  - type: textarea
    id: situation
    attributes:
      label: 어떤 때 불편했나요?
      placeholder: 예) 가로로 돌리면 다음 문제로 넘어가는 버튼을 찾기 어려워요.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 어떻게 바뀌면 좋을까요?
      description: 사용하고 싶은 모습을 편하게 적어 주세요. 아이 개인정보는 필요하지 않아요.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 참고 화면이나 기기 (선택)
      description: 화면을 올리면 시험용 기록으로 찍고 이름·얼굴 등은 가려 주세요. 기기는 아이패드/Safari 정도면 충분해요.
  - type: checkboxes
    id: privacy
    attributes:
      label: 공개 전 확인
      options:
        - label: 부모로서 작성하며 개인정보·비밀번호·백업 파일을 넣지 않았어요.
          required: true
